name: Verify and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run verify
      - run: npm run package
      - name: Generate package checksum
        run: cd dist && sha256sum *.ipk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: casa-webos-package
          path: |
            dist/*.ipk
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            design/browser-*.json
            design/*integration.png
            design/settings-720p.png
